name: Photometry & Spectral ML CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run circadian photometry & ML pipeline
        run: python hardware/python/circadian_ml_pipeline.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
